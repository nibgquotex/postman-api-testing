name: Postman API Tests with Newman

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository ka code checkout karein
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js install karein
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Newman global install karein
      - name: Install Newman
        run: npm install -g newman

      # 4. Newman ke zariye Collection aur Environment run karein
      - name: Run Postman Collection
        run: |
          newman run collection.json -e environment.json
